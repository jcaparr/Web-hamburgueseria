<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Hamburgueserías BA</title>
  <desc id="desc">Descubrí, calificá y reseñá las hamburgueserías de Buenos Aires. Hecha con Spring Boot 4, React 19, PostgreSQL 17 y Docker.</desc>
  <defs>
    <style>
      .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
      .in{opacity:0;animation:in .6s ease-out forwards}
      @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      .bob{animation:bob 3.2s ease-in-out infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="10%" cy="50%" r="40%">
      <stop offset="0" stop-color="#b45309" stop-opacity=".16"/>
      <stop offset="1" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1f2328" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="bunTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7c46f"/>
      <stop offset="1" stop-color="#d9862a"/>
    </linearGradient>
    <linearGradient id="bunBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaa64f"/>
      <stop offset="1" stop-color="#c47522"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="958" height="258" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="960" height="260" fill="url(#bg)"/>
    <rect width="960" height="260" fill="url(#grid)"/>
    <rect width="960" height="260" fill="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="958" height="258" rx="18" fill="none" stroke="#d0d7de" stroke-width="2"/>

  <!-- La hamburguesa -->
  <g transform="translate(46 70) scale(1.15)">
    <g class="bob">
      <path d="M8 46Q4 46 5 40C9 18 28 10 50 10C72 10 91 18 95 40Q96 46 92 46Z" fill="url(#bunTop)" stroke="#a9611a" stroke-width="1.6"/>
      <g fill="#fff3d6">
        <ellipse cx="32" cy="28" rx="3" ry="1.5" transform="rotate(-18 32 28)"/>
        <ellipse cx="50" cy="20" rx="3" ry="1.5" transform="rotate(10 50 20)"/>
        <ellipse cx="68" cy="28" rx="3" ry="1.5" transform="rotate(-12 68 28)"/>
        <ellipse cx="42" cy="37" rx="3" ry="1.5" transform="rotate(8 42 37)"/>
        <ellipse cx="62" cy="38" rx="3" ry="1.5" transform="rotate(-6 62 38)"/>
        <ellipse cx="80" cy="36" rx="3" ry="1.5" transform="rotate(16 80 36)"/>
        <ellipse cx="20" cy="38" rx="3" ry="1.5" transform="rotate(-10 20 38)"/>
      </g>
    </g>
    <path d="M4 52q4-5 8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0L96 52V58H4Z" fill="#79c84a" stroke="#4f9a2a" stroke-width="1.6" stroke-linejoin="round"/>
    <rect x="5" y="64" width="90" height="16" rx="8" fill="#6e3b1f" stroke="#4b2412" stroke-width="1.6"/>
    <path d="M4 58H96L90 65H82Q80 73 76 73Q72 73 70 65H40Q38 71 34 71Q30 71 28 65H12Z" fill="#ffc83d" stroke="#e3a514" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M8 83H92Q96 83 96 87V88Q96 96 88 96H12Q4 96 4 88V87Q4 83 8 83Z" fill="url(#bunBottom)" stroke="#a9611a" stroke-width="1.6"/>
  </g>

  <!-- El nombre -->
  <text class="sans in" x="186" y="104" font-size="44" font-weight="700" fill="#1f2328">Hamburgueserías BA</text>
  <text class="sans in" font-size="19" fill="#59636e" style="animation-delay:.2s">
    <tspan x="188" y="140">Descubrí, calificá y reseñá</tspan>
    <tspan x="188" y="166">las hamburgueserías de Buenos Aires.</tspan>
  </text>

  <g class="mono in" font-size="13" style="animation-delay:.4s">
    <rect x="188" y="186" width="118" height="28" rx="14" fill="#eff2f5" stroke="#d0d7de"/>
    <text x="247" y="205" fill="#31373d" text-anchor="middle">Spring Boot 4</text>
    <rect x="314" y="186" width="90" height="28" rx="14" fill="#eff2f5" stroke="#d0d7de"/>
    <text x="359" y="205" fill="#31373d" text-anchor="middle">React 19</text>
    <rect x="412" y="186" width="122" height="28" rx="14" fill="#eff2f5" stroke="#d0d7de"/>
    <text x="473" y="205" fill="#31373d" text-anchor="middle">PostgreSQL 17</text>
    <rect x="542" y="186" width="76" height="28" rx="14" fill="#eff2f5" stroke="#d0d7de"/>
    <text x="580" y="205" fill="#31373d" text-anchor="middle">Docker</text>
  </g>

  <!-- Un ranking de muestra -->
  <g class="in" style="animation-delay:.5s">
    <rect x="712" y="36" width="212" height="196" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text class="mono" x="732" y="74" font-size="12" fill="#6e7781">ranking · CABA</text>
    <path d="M712 88H924" stroke="#d0d7de" stroke-width="1.5"/>
    <g class="mono" font-size="13">
      <text x="732" y="118" fill="#b45309" font-weight="700">#1</text>
      <rect x="762" y="107" width="84" height="8" rx="4" fill="#d0d7de"/>
      <text x="762" y="132" font-size="12" fill="#b45309" letter-spacing="1">★★★★★</text>
      <text x="904" y="118" fill="#1f2328" font-weight="700" text-anchor="end">4.8</text>

      <text x="732" y="162" fill="#59636e" font-weight="700">#2</text>
      <rect x="762" y="151" width="66" height="8" rx="4" fill="#d0d7de"/>
      <text x="762" y="176" font-size="12" fill="#b45309" letter-spacing="1">★★★★<tspan fill="#d0d7de">★</tspan></text>
      <text x="904" y="162" fill="#1f2328" font-weight="700" text-anchor="end">4.6</text>

      <text x="732" y="204" fill="#59636e" font-weight="700">#3</text>
      <rect x="762" y="195" width="74" height="8" rx="4" fill="#d0d7de"/>
      <text x="762" y="220" font-size="12" fill="#b45309" letter-spacing="1">★★★★<tspan fill="#d0d7de">★</tspan></text>
      <text x="904" y="204" fill="#1f2328" font-weight="700" text-anchor="end">4.5</text>
    </g>
  </g>
</svg>
