<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Burgómetro: el stack, capa por capa</title>
  <desc id="desc">Una hamburguesa donde cada capa es una parte del sistema. Frontend: React 19, TypeScript y Vite. Borde: Caddy con HTTPS automático y CSP. Seguridad: Spring Security, JWT en cookies HttpOnly y rate limiting. API: Spring Boot 4 con Java 17. Datos externos: Google Places API. Persistencia: PostgreSQL 17 con Flyway.</desc>
  <defs>
    <style>
      .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','Cascadia Code','SF Mono',SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace}
      .drop{opacity:0;animation:drop .55s cubic-bezier(.2,.9,.25,1.2) forwards}
      @keyframes drop{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}
      .in{opacity:0;animation:in .5s ease-out forwards}
      @keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
      .layer{font-size:12px;fill:#b45309;letter-spacing:.04em}
      .main{font-size:16px;font-weight:600;fill:#1f2328}
      .det{font-weight:400;fill:#59636e}
    </style>
    <linearGradient id="bunTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7c46f"/>
      <stop offset="1" stop-color="#d9862a"/>
    </linearGradient>
    <linearGradient id="bunBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaa64f"/>
      <stop offset="1" stop-color="#c47522"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="958" height="468" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text class="mono" x="440" y="46" font-size="13" fill="#6e7781"><tspan fill="#0969da" font-weight="700">GET</tspan> /proyectos/hamburgueserias-ba/stack</text>

  <!-- Líneas guía -->
  <g stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="3 4">
    <path d="M372 93H426"/><path d="M372 160H426"/><path d="M372 222H426"/>
    <path d="M372 284H426"/><path d="M372 346H426"/><path d="M372 406H426"/>
  </g>
  <g fill="#b45309">
    <circle cx="428" cy="93" r="3"/><circle cx="428" cy="160" r="3"/><circle cx="428" cy="222" r="3"/>
    <circle cx="428" cy="284" r="3"/><circle cx="428" cy="346" r="3"/><circle cx="428" cy="406" r="3"/>
  </g>

