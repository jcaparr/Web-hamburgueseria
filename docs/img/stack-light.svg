    <path d="M74 124Q66 124 68 114C76 74 130 58 210 58C290 58 344 74 352 114Q354 124 346 124Z" fill="url(#bunTop)" stroke="#a9611a" stroke-width="2"/>
    <ellipse cx="150" cy="80" rx="42" ry="7" fill="#ffffff" fill-opacity=".22" transform="rotate(-8 150 80)"/>
    <g fill="#fff3d6">
      <ellipse cx="128" cy="90" rx="5" ry="2.4" transform="rotate(-20 128 90)"/>
      <ellipse cx="168" cy="74" rx="5" ry="2.4" transform="rotate(12 168 74)"/>
      <ellipse cx="206" cy="92" rx="5" ry="2.4" transform="rotate(-8 206 92)"/>
      <ellipse cx="248" cy="74" rx="5" ry="2.4" transform="rotate(18 248 74)"/>
