    <rect x="80" y="336" width="126" height="20" rx="10" fill="#e8513f" stroke="#b8382a" stroke-width="2"/>
    <rect x="214" y="336" width="126" height="20" rx="10" fill="#e8513f" stroke="#b8382a" stroke-width="2"/>
    <g fill="#ffd2c4">
      <ellipse cx="112" cy="346" rx="4" ry="2.2"/><ellipse cx="143" cy="346" rx="4" ry="2.2"/><ellipse cx="174" cy="346" rx="4" ry="2.2"/>
      <ellipse cx="246" cy="346" rx="4" ry="2.2"/><ellipse cx="277" cy="346" rx="4" ry="2.2"/><ellipse cx="308" cy="346" rx="4" ry="2.2"/>
