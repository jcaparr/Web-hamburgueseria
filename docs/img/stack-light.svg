  </g>

  <!-- Las capas -->
  <g class="mono">
    <text class="layer in" x="440" y="87" style="animation-delay:1.2s">01 · FRONTEND</text>
    <text class="layer in" x="440" y="154" style="animation-delay:1.0s">02 · BORDE</text>
    <text class="layer in" x="440" y="216" style="animation-delay:.8s">03 · SEGURIDAD</text>
    <text class="layer in" x="440" y="278" style="animation-delay:.6s">04 · API</text>
    <text class="layer in" x="440" y="340" style="animation-delay:.4s">05 · DATOS EXTERNOS</text>
    <text class="layer in" x="440" y="400" style="animation-delay:.2s">06 · PERSISTENCIA</text>
  </g>
  <g class="sans">
    <text class="main in" x="440" y="109" style="animation-delay:1.25s">React 19 · TypeScript · Vite<tspan class="det"> · Tailwind + daisyUI</tspan></text>
    <text class="main in" x="440" y="176" style="animation-delay:1.05s">Caddy<tspan class="det"> · HTTPS automático · CSP estricta</tspan></text>
    <text class="main in" x="440" y="238" style="animation-delay:.85s">Spring Security<tspan class="det"> · JWT en cookies HttpOnly · rate limiting</tspan></text>
    <text class="main in" x="440" y="300" style="animation-delay:.65s">Spring Boot 4 · Java 17<tspan class="det"> · Spring Data JPA</tspan></text>
    <text class="main in" x="440" y="362" style="animation-delay:.45s">Google Places API<tspan class="det"> · sync programada con control de cuota</tspan></text>
    <text class="main in" x="440" y="422" style="animation-delay:.25s">PostgreSQL 17 · Flyway<tspan class="det"> · 25 migraciones versionadas</tspan></text>
  </g>

  <text class="mono" x="440" y="452" font-size="12" fill="#6e7781">docker compose  ·  github actions  ·  dependabot  ·  46 clases de test</text>
</svg>
