# Sin esto, dependabot abre PRs que nadie puede evaluar: GitHub los marca
# "mergeable" cuando no hay conflicto de git, que no dice nada sobre si compilan.
# Así llegó a proponerse un salto a Spring Boot 4 que no compilaba.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo cancela la corrida vieja de la misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          # La misma que <java.version> en el pom: el CI no sirve si prueba
          # contra una JDK distinta de la que usa el Dockerfile.
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Compilar y correr los tests
        working-directory: backend
        # Los tests corren en H2 y sin salida a internet; el perfil de test apaga
        # el mail y el chequeo de contraseñas filtradas.
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # LTS, igual que el Dockerfile del frontend.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar
        working-directory: frontend
        # ci y no install: respeta el lock, que es justo lo que el PR cambia.
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        # tsc -b entra acá: es lo que agarra un salto de major de TypeScript.
        run: npm run build
