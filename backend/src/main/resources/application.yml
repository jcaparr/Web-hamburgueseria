server:
  port: ${SERVER_PORT:8080}

spring:
  # Everything environment-specific lives in application-dev.yml / application-prod.yml.
  # Dev is the default so that running the app locally needs no extra setup.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    # Existing databases already carry the V1 schema from the ddl-auto=update days:
    # stamp them as baseline instead of replaying a migration that would fail.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # Flyway owns the schema now; Hibernate only checks that the entities still match it.
      ddl-auto: validate
    open-in-view: false
  mail:
    # host/username/password come from the environment only (SPRING_MAIL_HOST and
    # friends). With no host set, Spring creates no mail sender and EmailService
    # writes the message to the log instead, which is what makes local development
    # work without an SMTP account.
    port: ${MAIL_PORT:587}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      # Without timeouts a hung SMTP server would hang the request thread with it.
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  # Una foto de celular ronda los 3 MB, y las de gama alta pasan los 8; 12 entra sin
  # que nadie tenga que achicarla antes, y sigue lejos de que una subida cualquiera
  # pueda ocupar memoria a voluntad. Lo que queda en disco pesa mucho menos: al entrar
  # se achica a 2048 de lado y se reescribe.
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 14MB

app:
  # Las fotos que sube la gente, aparte de las que bajan de Google: son de otra
  # procedencia y conviene poder moverlas o borrarlas sin tocar las otras.
  fotos-de-resenias:
    directorio: ${RATING_PHOTOS_DIR:./data/rating-photos}

  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${ALLOWED_ORIGIN}
  mail:
    # Off by default: a machine with no SMTP configured writes the messages to the
    # log instead of failing. Production turns it on, and then refuses to start
    # unless there is a real sender behind it.
    enabled: ${MAIL_ENABLED:false}
    # Must be the same address as SPRING_MAIL_USERNAME: Gmail rejects a From it
    # did not authenticate.
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:Hamburgueserías BA}
  auth:
    session:
      access-token-minutes: 15
      refresh-token-days: 30
      # Una cookie Secure no viaja por HTTP, que es todo entorno de desarrollo.
      # Producción lo pisa en true y no debe correr sin eso.
      cookie-secure: false
    google:
      # Public by design: it ships inside the frontend bundle. Empty disables signing
      # in with Google.
      client-id: ${GOOGLE_CLIENT_ID:}
    verification:
      code-length: 6
      ttl-minutes: 10
      max-attempts: 5
      resend-cooldown-seconds: 60
  places:
    # Las cadenas de comida rápida, que en Explorar se pueden apagar. Se reconocen por
    # el principio del nombre, sin mayúsculas ni puntuación: "burgerking" abarca a
    # "Burger King - Sucursal P.Italia", y "wendys" a "Wendy's" y a "Wendys", que en
    # Google están escritas de las dos formas.
    fast-food-brands:
      - burgerking
      - mcdonalds
      - wendys
      - mostaza
      # Las tres de abajo son cadenas locales, con más sucursales que varias de las de
      # arriba: Mr Tasty tiene trece en la base, Dean & Dennys ocho y Hamburguesas
      # Extremas once. Sin esto, apagar las cadenas en Explorar dejaba treinta y dos
      # sucursales de tres marcas en el listado.
      - hamburguesasextremas
      - deandennys
      - mrtasty
    api-key: ${GOOGLE_MAPS_API_KEY:}
    sync:
      # Off by default even with a key configured: flip to true only when you're ready for it to run.
      enabled: ${PLACES_SYNC_ENABLED:false}
      cron: ${PLACES_SYNC_CRON:0 0 4 * * SUN}
      trigger-token: ${PLACES_SYNC_TOKEN:}
      # Cada forma de preguntar es una búsqueda aparte, con su propio tope de sesenta
      # resultados, y Google contesta distinto según cómo se le pregunte. Sumarlas es lo
      # que amplía la cobertura: en Palermo las primeras cuatro pasaron de 38 locales a
      # 92, y en Mataderos de 26 a 80. Repetir la corrida con las mismas preguntas no
      # trae nada nuevo; las de abajo son las que agregan.
      query-templates:
        - "hamburguesería en {barrio}, Buenos Aires"
        - "hamburguesas en {barrio}, Buenos Aires"
        - "smash burger en {barrio}, Buenos Aires"
        - "burgers en {barrio}, Buenos Aires"
        - "hamburguesas artesanales en {barrio}, Buenos Aires"
        - "burger en {barrio}, Buenos Aires"
        - "cheeseburger en {barrio}, Buenos Aires"
      # Rubros que no son una hamburguesería, aunque el nombre diga "burger". Los seis
      # primeros salieron de la base: una fábrica de salchichas, un mayorista de
      # medallones, una carnicería, un pelotero con cantina y dos distribuidoras. Los
      # cinco de abajo son de comida, pero de otra cosa: una pizzería que se llama
      # "Pizza, Birra & Burger" sigue siendo una pizzería. Sin esto entran por el
      # nombre, que es la puerta más ancha del filtro.
      excluded-primary-types:
        - manufacturer
        - wholesaler
        - butcher_shop
        - indoor_playground
        - food_store
        - store
        - pizza_restaurant
        - bakery
        - barbecue_restaurant
        - steak_house
        - ice_cream_shop
        # Los de abajo salieron de revisar la base: kioscos y almacenes que venden
        # hamburguesas sueltas. Ahora solo descalifican si el local no tiene además el
        # rubro de hamburguesas: "Panchos Y Hamburguesas" figura como almacén y como
        # hamburguesería, y es las dos cosas.
        - convenience_store
        - grocery_store
        - supermarket
        - sandwich_shop
        - hot_dog_restaurant
        - coffee_shop
        - cafe
      # Fichas que Google tiene mal cargadas y ninguna regla puede filtrar.
      excluded-place-ids:
        # "Myc La dimensión 3d": figura como gastropub con hamburguesas, pero el sitio
        # que declara es un local de impresión 3D.
        - ChIJY3FewTLLvJURBCPfAV6IANY
        # Los tres de abajo entraban porque el nombre menciona hamburguesas, pero el
        # nombre mismo dice que son otra cosa: un menú mezclado, no una hamburguesería.
        # "La Estación - Abasto - Pizza, Birra & Burger": pizzería.
        - ChIJc3k2U4rKvJUR1Xk2NFXPBPI
        # "La Estación - Flores - Pizza, Birra & Burger": pizzería.
        - ChIJc1mB_JDJvJURy5X3-xm8TcM
        # "Uff! Que Sabroso": empanadas, arepas, tequeños y hamburguesas, entre otras.
        - ChIJm8NqyRnLvJURnT9V4zyhMXk
        # Los dos de abajo entraron con la tanda de preguntas nuevas: Google los marca
        # como hamburguesería y el nombre dice lo que son en realidad.
        # "Parrilla de Homero", en la Costanera Sur: una parrilla, famosa por los
        # sándwiches de bondiola.
        - ChIJ8YuQn6E1o5UR8RZ6EMOE024
        # "Milanga& Co": cadena de sándwiches de milanesa, no vende hamburguesas.
        - ChIJpZeFRwDLvJURYfpCURzGISA
        # Los dos de abajo salieron de mirar las fotos que el propio local tiene en
        # Google, que es el único lugar donde se ve qué cocinan. No hay regla que los
        # agarre: Google los da como hamburguesería igual.
        # "Las Delicias de O & P": rotisería. De sus diez fotos ninguna es una
        # hamburguesa; son fugazzas, una milanesa a caballo y un pollo al horno.
        - ChIJeUPEbarOvJURhWbGRz-dl6c
        # "Pizza Burger": pizzería, como las dos "Pizza, Birra & Burger" de arriba.
        # Es el único de la base al que Google no le pone el rubro hamburguesería:
        # entró solo por tener "burger" en el nombre.
        - ChIJB2UW9My1vJUR4qN1P3ZodXM
        # Los cinco de abajo salieron de mirar, una por una, las fotos que cada local
        # tiene en Google. Es el único lugar donde se ve qué cocinan, y en los cinco lo
        # que se ve es otra cosa. Ninguna regla los agarra: Google les pone el rubro
        # hamburguesería igual.
        # "Labarden hamburguesas y pizzas": de pizzas, que es lo que muestra.
        - ChIJfY3jagDLvJURbkncyQMEuSw
        # "Colombres esq San Juan": un bar de desayunos. Huevos, tostadas y café.
        - ChIJXyCeMFLLvJURaclMz2Im9zM
        # "Sanguchazo": una fiambrería. El cartel de la puerta lo dice —"Fiambrería MJ,
        # quesos, dulces, encurtidos"— y ahí adentro funciona el mostrador de sánguches.
        - ChIJ44LnQwDJvJURSTzNIX6BjLk
        # "Xardo": una parrilla. Chorizos, morcillas y provoleta sobre la parrilla.
        - ChIJWa8GmgbJvJURxVwfjI7FwF8
        # "La Rubia": un almacén. La foto es la góndola de galletitas.
        - ChIJSS4CeaHJvJURc7wYnWHVzuY
      # Hamburgueserías que Google clasifica como otra cosa y que ninguna regla rescata.
      # Entran acá solo si el local es una hamburguesería de hecho, no un bar que además
      # vende hamburguesas.
      included-place-ids:
        # "Beggars Caballito": figura como bar, y es una hamburguesería.
        - ChIJmbiqDoLLvJURbe0kVxQAdk4
        # "Draken", en La Boca: figura como cervecería, y es una hamburguesería.
        - ChIJ8Rg7fKQ1o5URZEvZ9P58vFs
      # La foto de portada elegida a mano, para los locales donde la regla no acierta.
      #
      # La regla sabe elegir una foto bien sacada —apaisada, grande, no una captura de
      # pantalla— pero no sabe qué muestra. Entre la fachada del local y una bandeja de
      # empanadas no hay nada en los datos que las distinga: las dos son fotografías del
      # mismo tamaño subidas por el local. Eso solo se arregla mirando, y lo que se mira
      # una vez conviene que quede escrito.
      #
      # La clave es el place_id y el valor la huella de la foto, que es "anchoxalto|quién
      # la subió". Se usa la huella y no el nombre porque el nombre que devuelve Google es
      # un vale de descarga que cambia en cada pedido; la huella vuelve siempre igual.
      #
      # Para sacar la huella de un local:
      #   curl -H "X-Goog-Api-Key: $GOOGLE_MAPS_API_KEY" \
      #        -H "X-Goog-FieldMask: photos" \
      #        "https://places.googleapis.com/v1/places/<place_id>"
      # y armarla con widthPx, heightPx y el displayName del primer authorAttributions.
      #
      # Si la huella anotada no aparece entre las fotos del local —la borraron, o está mal
      # copiada— manda la regla, como si no estuviera anotada. El local no se queda sin
      # portada por un error de acá.
      #
      # Ejemplo:
      #   ChIJ1wMsjJe1vJURjHbgtBrHg6A: "1200x900|Un cliente"
      fotos-elegidas: {}
      # 3 es el máximo que devuelve Google por consulta (60 resultados); pedir más
      # no trae nada nuevo.
      max-pages-per-area: 3
      delay-between-calls-ms: 500
      # Los 48 barrios de la Ciudad de Buenos Aires. Antes eran 20, así que media
      # ciudad no se buscaba nunca. Cada barrio son 7 preguntas de hasta 3 páginas:
      # 1.008 búsquedas como mucho, contra las 5.000 gratis por mes.
      areas:
        - Agronomía
        - Almagro
        - Balvanera
        - Barracas
        - Belgrano
        - Boedo
        - Caballito
        - Chacarita
        - Coghlan
        - Colegiales
        - Constitución
        - Flores
        - Floresta
        - La Boca
        - La Paternal
        - Liniers
        - Mataderos
        - Monserrat
        - Monte Castro
        - Nueva Pompeya
        - Núñez
        - Palermo
        - Parque Avellaneda
        - Parque Chacabuco
        - Parque Chas
        - Parque Patricios
        - Puerto Madero
        - Recoleta
        - Retiro
        - Saavedra
        - San Cristóbal
        - San Nicolás
        - San Telmo
        - Vélez Sársfield
        - Versalles
        - Villa Crespo
        - Villa del Parque
        - Villa Devoto
        - Villa General Mitre
        - Villa Lugano
        - Villa Luro
        - Villa Ortúzar
        - Villa Pueyrredón
        - Villa Real
        - Villa Riachuelo
        - Villa Santa Rita
        - Villa Soldati
        - Villa Urquiza
        # Hasta acá los 48 barrios de la Ciudad. De acá para abajo, el conurbano y las
        # ciudades del borde: los partidos del Gran Buenos Aires más La Plata, San
        # Vicente, Cañuelas, Luján y Belén de Escobar, que son los límites que se
        # quisieron cubrir. Todos caen dentro de los 75 km desde el Obelisco, que es lo
        # que decide qué entra: esta lista dice dónde preguntar, el radio dice qué se
        # acepta.
        #
        # Son 40 localidades más. A 7 preguntas de hasta 3 páginas cada una, el total
        # pasa de 1.008 a 1.848 búsquedas por corrida, contra las 5.000 gratis por mes.
        - Avellaneda
        - Lanús
        - Lomas de Zamora
        - Quilmes
        - Berazategui
        - Florencio Varela
        - Almirante Brown
        - Esteban Echeverría
        - Ezeiza
        - San Vicente
        - Cañuelas
        - La Matanza
        - Ramos Mejía
        - Morón
        - Castelar
        - Ituzaingó
        - Hurlingham
        - Merlo
        - Moreno
        - General Rodríguez
        - Luján
        - Marcos Paz
        - Tres de Febrero
        - Caseros
        - San Martín
        - Vicente López
        - Olivos
        - Martínez
        - San Isidro
        - Beccar
        - San Fernando
        - Tigre
        - Don Torcuato
        - Pilar
        - Belén de Escobar
        - Garín
        - Malvinas Argentinas
        - José C. Paz
        - San Miguel
        - La Plata
        - Berisso
    quota:
      # Los tramos gratuitos de Google son 5.000 búsquedas, 5.000 fichas y 1.000 fotos
      # por mes. Acá se frena antes de cada uno: pasado el tope no se llama más, así
      # que la factura no puede aparecer sola.
      monthly-search-calls: 4000
      # Las fichas van más cerca del tope que las búsquedas, y es a propósito.
      #
      # Completar la portada de un local cuesta una ficha para preguntar y una foto para
      # bajar, y hay cinco veces más fichas gratis que fotos. Con el margen en mil, las
      # fichas se terminaban antes que las fotos y el mes cerraba con fotos sin usar:
      # cuota gratis que no se acumula y se pierde el día 1. Doscientas de margen
      # alcanzan para que el freno siga estando y la foto vuelva a ser lo que manda.
      monthly-details-calls: 4800
      monthly-photo-calls: 1000
    photos:
      directory: ${PLACE_PHOTOS_DIR:./data/place-photos}
      max-width-px: 800
