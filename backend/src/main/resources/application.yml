    quota:
      # Los tramos gratuitos de Google son 5.000 búsquedas, 5.000 fichas y 1.000 fotos
      # por mes. Acá se frena antes de cada uno: pasado el tope no se llama más, así
      # que la factura no puede aparecer sola.
      monthly-search-calls: 4000
      # Las fichas van más cerca del tope que las búsquedas, y es a propósito.
      #
      # Completar la portada de un local cuesta una ficha para preguntar y una foto para
      # bajar, y hay cinco veces más fichas gratis que fotos. Con el margen en mil, las
      # fichas se terminaban antes que las fotos y el mes cerraba con fotos sin usar:
      # cuota gratis que no se acumula y se pierde el día 1. Doscientas de margen
      # alcanzan para que el freno siga estando y la foto vuelva a ser lo que manda.
      monthly-details-calls: 4800
      monthly-photo-calls: 1000
      # El horario es un campo Enterprise, con su propio tramo de 1.000 gratis por mes.
      # Son más locales que eso, así que completarlos lleva dos meses: los que no
      # entran en este los toma el próximo, porque se pregunta primero por los que
      # nunca se preguntaron.
      monthly-horario-calls: 950
    photos:
      directory: ${PLACE_PHOTOS_DIR:./data/place-photos}
      max-width-px: 800
