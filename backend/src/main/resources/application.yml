server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hamburguesas
    username: ${DB_USER:hamburguesas}
    password: ${DB_PASSWORD:hamburguesas}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-please-32bytes-min}
    expiration-minutes: 60
  cors:
    allowed-origins: ${ALLOWED_ORIGIN:http://localhost:5173}
