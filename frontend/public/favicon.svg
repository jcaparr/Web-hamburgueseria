<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- El logo de Burgómetro para la pestaña: sobre un cuadrado marrón, para que se vea
       igual en una barra clara que en una oscura. A 16 px no entran el pan de abajo ni
       siete semillas, así que es el tablero con cinco, la aguja, el cheddar y la carne. -->
  <rect width="64" height="64" rx="14" fill="#3a2a1e"/>
  <g stroke="#f7efd8" stroke-linejoin="round">
    <rect x="9" y="42" width="46" height="9" rx="4.5" fill="#7a4526" stroke-width="2.5"/>
    <path d="M11 40 H53 L51 44.5 H42 C42 48.5 37 48.5 37 44.5 H13 Z" fill="#f2b705" stroke-width="2"/>
    <path d="M9 39 A23 23 0 0 1 55 39 Z" fill="#cf8636" stroke-width="2.5"/>
  </g>
  <g fill="#f7efd8">
    <ellipse cx="16.02" cy="33.19" rx="1.6" ry="3.2" transform="rotate(-70 16.02 33.19)"/>
    <ellipse cx="22.25" cy="25.07" rx="1.6" ry="3.2" transform="rotate(-35 22.25 25.07)"/>
    <ellipse cx="32" cy="22" rx="1.6" ry="3.2"/>
    <ellipse cx="41.75" cy="25.07" rx="1.6" ry="3.2" transform="rotate(35 41.75 25.07)"/>
    <ellipse cx="47.98" cy="33.19" rx="1.6" ry="3.2" transform="rotate(70 47.98 33.19)"/>
  </g>
  <polygon points="45.79,27.43 33.67,40.99 30.33,37.01" fill="#b23a2e" stroke="#f7efd8" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="32" cy="39" r="3.6" fill="#f7efd8"/>
</svg>
