services:
  db:
    # Same major version as production (see deploy/docker-compose.prod.yml).
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hamburguesas
      POSTGRES_USER: hamburguesas
      POSTGRES_PASSWORD: hamburguesas
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
